title: "Артём Носков"
person:
  name: Артём Носков
  role: Программист с интересом к вебу
  about: |
    Привет! Я Артём Носков, fullstack-разработчик из Челябинска.
    Занимаюсь вебом больше шести лет. Основной стек: PHP, Laravel, Vue, JavaScript, TypeScript и Golang.
    Базы и инфраструктура: PostgreSQL, MySQL, Redis, RabbitMQ, Docker, Kubernetes.

    Последние годы много работаю с LLM: разворачиваю модели на собственных мощностях,
    дообучаю их под внутренние задачи, собираю MCP-серверы и AI-агентов,
    которые работают с реальными данными компании.

    С 2025 работаю в RnD-отделе «Металлинвестбанка»: внутренние сервисы банка и внедрение LLM.
    До этого был в Lofty (backend маркетплейса для SMM-сервисов, 2024–2025)
    и TPT Hub (fullstack в системе управления логистикой автопарка, 2020–2024).

    Учился в Южно-Уральском государственном университете, бакалавриат и магистратура
    по фундаментальной информатике и информационным технологиям. Русский родной, английский B2.
  contacts:
    email: artem@noartem.ru
    x: noonartem
    telegram: nooskoov
    github: noartem
    linkedin: noartem
