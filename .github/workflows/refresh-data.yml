name: Refresh data

# Keeps profile data current:
#  - daily scheduled run
#  - immediate run when the bucket repo changes (repository_dispatch: bucket-updated)
# Regenerates bucket.yml, _includes/bucket-rows.njk, assets/profile.jpg + favicon.
# Profile README tables are maintained by noartem/noartem refresh.yml workflow.

on:
  schedule:
    - cron: "0 6 * * *" # daily 06:00 UTC
  workflow_dispatch:
  repository_dispatch:
    types: [bucket-updated]

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: npm ci || npm install

      - name: Fetch bucket + avatar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/fetch-data.cjs

      - name: Detect changes
        id: diff
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Regenerate favicon from new avatar
        if: steps.diff.outputs.changed == 'true'
        run: node scripts/generate-favicon.cjs

      - name: Trigger site deploy
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy-to-ghpages.yml --ref main
