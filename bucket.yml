bucket:
  install: |-
    scoop bucket add noartem https://github.com/noartem/bucket
    scoop install noartem/<name>
  apps:
    - name: blick
      version: "0.2.1"
      url: https://blickeditor.com/
      description: "Fully native non-linear video editor built from scratch. Scrub, cut, and keyframe with fast feedback; available as a free public beta for Windows."
      license: Proprietary
    - name: cloakui
      version: "0.1.0"
      url: https://github.com/noartem/cloakui
      description: Windows GUI for Cloak CLI. Tray OTP popup for the cloak CLI.
      license: Unknown
      repo: noartem/cloakui
    - name: fastpotify
      version: "0.8.0"
      url: https://github.com/crmne/fastpotify
      description: Spotify, native and fast. One lightweight Rust app for your whole library, local playback, and Spotify Connect.
      license: MIT
      repo: crmne/fastpotify
    - name: recordly
      version: "1.4.0"
      url: https://recordly.dev/
      description: Open-source screen recorder with auto-zoom, animated cursors, and a timeline editor for polished demo videos.
      license: AGPL-3.0
      repo: webadderallorg/Recordly
    - name: t3code
      version: "0.0.42"
      url: https://t3.codes
      description: ""
      license: MIT
      repo: pingdotgg/t3code
    - name: taskslinger
      version: "0.9.0"
      url: https://taskslinger.net/
      description: Native Windows task manager replacement built in C/Win32 with a custom Direct3D UI. Process, performance, services, startup, and connection monitoring with fast startup and no telemetry.
      license: Proprietary
    - name: twentymate
      version: "2.3.1"
      url: https://github.com/noartem/twentymate
      description: 20-20-20 windows app
      license: GPL-3.0-only
      repo: noartem/twentymate
    - name: vantage-box
      version: "1.4.6"
      url: https://github.com/noartem/vantage-box
      description: Minimalistic desktop GUI for sing-box
      license: MIT
      repo: noartem/vantage-box
